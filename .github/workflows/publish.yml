name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/corebot-container-smoke
          tags: |
            type=raw,value=0.1.0
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/corebot-container-smoke" \
              -f visibility=public; then
              echo "Pacote publicado como public."
              exit 0
            fi
            echo "Pacote ainda nao visivel na API (tentativa ${attempt}/5)."
            sleep 5
          done
          echo "Nao foi possivel tornar o pacote public automaticamente." >&2
          echo "Abra https://github.com/users/${{ github.repository_owner }}/packages/container/corebot-container-smoke/settings" >&2
          exit 0
